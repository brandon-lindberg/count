name: Worker (mirror reconcile)

# Daily safety net: re-copies the recent window of samples/rollups into the main
# backend DB to repair anything the poll-time mirror missed. Inserts are
# if-absent, so clean runs are cheap no-ops.
on:
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-count-scraper-reconcile
  cancel-in-progress: false

jobs:
  run-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_NAME: Steam Player Count Scraper
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_ECHO: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_API_BASE_URL: ${{ vars.SOURCE_API_BASE_URL }}
      SOURCE_API_TOKEN: ${{ secrets.SOURCE_API_TOKEN }}
      MIRROR_DATABASE_URL: ${{ secrets.MIRROR_DATABASE_URL }}
      MIRROR_DATABASE_USE_SSL: ${{ vars.MIRROR_DATABASE_USE_SSL || 'false' }}
      HTTP_TIMEOUT_SECONDS: ${{ vars.HTTP_TIMEOUT_SECONDS || '45' }}
      MIRROR_RECONCILE_DAYS: ${{ vars.MIRROR_RECONCILE_DAYS || '3' }}
      WORKER_CYCLE_MAX_SECONDS: "2100"
      WORKER_CYCLE_SHUTDOWN_GRACE_SECONDS: "60"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required settings
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is required"; exit 1; }
          test -n "$MIRROR_DATABASE_URL" || { echo "MIRROR_DATABASE_URL secret is required to reconcile into backend DB"; exit 1; }

      - name: Run mirror reconcile
        run: bash ./scripts/with_asyncpg_env.sh python -m app.run_scheduled_jobs --pipeline reconcile
